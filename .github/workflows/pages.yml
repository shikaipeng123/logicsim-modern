name: Build & Deploy to GitHub Pages

# 流程：确认前端依赖就位 -> 跑引擎回归测试 -> 发布 public/ 到 GitHub Pages
# public/lib 里的第三方库是提交进仓库的，所以通常这一步什么都不用做；
# 万一缺失（比如为了缩小仓库手工删过），会由 vendor-deps.sh 按固定版本补回来。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 确认前端依赖就位（缺失时按固定版本拉取）
        run: bash scripts/vendor-deps.sh public/lib

      - name: 引擎回归测试
        run: node tests/engine.test.js

      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # 仓库还没有 Pages 站点时自动开启

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
